{% extends 'base.html' %}{% block title %}Candidate Details{% endblock %}{% block content %}<div class="page-head"><div><div class="eyebrow">CANDIDATE RECORD</div><h1>{{ 'Edit candidate' if candidate else 'Add candidate' }}</h1></div><a class="btn btn-outline" href="{{ url_for('dashboard') }}">Back to dashboard</a></div><section class="panel form-panel"><form method="post" class="form-grid"><label>Candidate ID<input name="candidate_code" required value="{{ candidate['candidate_code'] if candidate else '' }}"></label><label>Full name<input name="full_name" required value="{{ candidate['full_name'] if candidate else '' }}"></label><label>Email address<input type="email" name="email" required value="{{ candidate['email'] if candidate else '' }}"></label><label>Phone number<input name="phone" value="{{ candidate['phone'] if candidate else '' }}"></label>{% if candidate %}<label class="wide">Assigned task<input name="assigned_task" value="{{ candidate['assigned_task'] }}"></label><label>Task status<select name="task_status">{% for s in ['Pending','In Progress','Completed'] %}<option {% if candidate['task_status']==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></label><label>Task deadline<input type="date" name="task_deadline" value="{{ candidate['task_deadline'] }}"></label><label class="wide">Reviewer feedback<textarea name="feedback" rows="3">{{ candidate['feedback'] }}</textarea></label>{% endif %}<div class="wide"><button class="btn btn-dark" type="submit">Save candidate</button></div></form></section>{% endblock %}
